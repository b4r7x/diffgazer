<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Diffgazer</title>
    <!-- Pre-paint theme bootstrap. Parser-blocking and self-contained on purpose:
         it must stamp the stored theme before the first paint, which rules out
         importing src/theme-bootstrap.ts. That module owns the same storage key
         and colors for the React ThemeProvider, and theme-bootstrap.test.ts runs
         this exact script against its exports so the two cannot drift.
         The nonce placeholder is filled by the embedding CLI server, whose CSP
         allows inline scripts only by nonce; a plain vite dev/preview server
         serves no CSP and ignores it. -->
    <script nonce="{{cspNonce}}">
      (() => {
        try {
          let stored = null;
          try {
            stored = localStorage.getItem("diffgazer-theme");
          } catch {
            // Storage is unreadable in locked-down browsers; use the OS preference.
          }
          const system = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
          const theme = stored === "dark" || stored === "light" ? stored : system;
          const root = document.documentElement;
          root.setAttribute("data-theme", theme);
          root.style.colorScheme = theme;
          const themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) {
            themeColor.setAttribute("content", theme === "dark" ? "#0d1117" : "#ffffff");
          }
        } catch {
          // A browser this script cannot run in keeps the served default palette.
        }
      })();
    </script>
  </head>
  <body class="ui-base">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
