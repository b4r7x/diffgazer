limit_req_zone $binary_remote_addr zone=registry:10m rate=10r/s;

# The registry sits behind Coolify's Traefik, which terminates TLS. The Docker
# build replaces this fail-closed local default with the exact Traefik peer
# supplied by the deployment.
set_real_ip_from 127.0.0.1/32;
real_ip_header X-Forwarded-For;
# Traefik appends the connected client address to X-Forwarded-For. Taking the
# right-most address ignores any client-supplied prefix in that chain.
real_ip_recursive off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    gzip on;
    gzip_types application/json text/css application/javascript text/plain text/xml;
    gzip_min_length 256;
    gzip_vary on;

    set $security_frame_options "DENY";
    set $security_content_security_policy "default-src 'none'; frame-ancestors 'none'";

    # Security headers (server-level; the include is repeated in every location
    # and OPTIONS block because nginx headers do not inherit once a block
    # sets any header of its own).
    include /etc/nginx/snippets/security-headers.conf;

    # Default: reject everything not explicitly allowed
    location / { return 404; }

    location = /favicon.ico { return 204; }

    location ^~ /schema/ {
        limit_req zone=registry burst=100 nodelay;

        include /etc/nginx/snippets/security-headers.conf;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Cache-Control "public, max-age=86400" always;

        if ($request_method = OPTIONS) {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            return 204;
        }

        limit_except GET HEAD OPTIONS {
            deny all;
        }
    }

    location ~ ^/r/(ui|keys)/ {
        limit_req zone=registry burst=100 nodelay;

        include /etc/nginx/snippets/security-headers.conf;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Cache-Control "public, max-age=3600, s-maxage=86400" always;

        types { application/json json; }
        default_type application/json;

        if ($request_method = OPTIONS) {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            return 204;
        }

        limit_except GET HEAD OPTIONS {
            deny all;
        }
    }
}
