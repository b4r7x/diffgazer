name: Docker Build

on:
  pull_request:
    paths:
      - .dockerignore
      - Dockerfile
      - deploy/**
      - scripts/**
      - apps/docs/**
      - apps/landing/**
      - libs/**
      - cli/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/docker-build.yml
  push:
    branches:
      - main
    paths:
      - .dockerignore
      - Dockerfile
      - deploy/**
      - scripts/**
      - apps/docs/**
      - apps/landing/**
      - libs/**
      - cli/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/docker-build.yml

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: docs
            dockerfile: Dockerfile
          - image: registry
            dockerfile: deploy/registry.Dockerfile
          - image: landing
            dockerfile: deploy/landing.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --pull -f "${{ matrix.dockerfile }}" -t "diffgazer-${{ matrix.image }}:ci" .

      # Same severity gate deploy.yml applies to the pushed digest, run here on the
      # image this change set produces. Without it a Dependabot base-image bump merges
      # green and a CRITICAL/HIGH regression first surfaces inside a manual production
      # deploy instead of on the PR that introduced it.
      - name: Scan built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: diffgazer-${{ matrix.image }}:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
