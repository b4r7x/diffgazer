name: Deploy Public Surfaces

on:
  workflow_dispatch:
    inputs:
      target:
        description: Public surfaces to deploy
        required: true
        default: docs-registry
        type: choice
        options:
          - docs-registry
          - landing
          - all
      confirm_production:
        description: Type "deploy" to confirm production deployment
        required: true
        type: string
      image_sha:
        description: >-
          Optional rollback: full 40-char commit SHA of a previously built and
          deployed image. When set, the digests that SHA's deploy run scanned are
          re-promoted to :prod instead of building from main HEAD, so the rollback
          needs that run's digest records to be unexpired.
        required: false
        type: string

concurrency:
  group: deploy-public-surfaces-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-request:
    name: Validate Manual Request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      # SHA actually deployed: the rollback image_sha when provided, else HEAD.
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      # "true" when rolling back to a pre-built image (skips build-scan).
      rollback: ${{ steps.resolve.outputs.rollback }}
    steps:
      - name: Require production confirmation
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
        run: |
          if [ "${CONFIRM_PRODUCTION}" != "deploy" ]; then
            echo "::error::confirm_production must equal 'deploy'."
            exit 1
          fi

      - name: Require main branch
        env:
          DEPLOY_REF: ${{ github.ref }}
        run: |
          if [ "${DEPLOY_REF}" != "refs/heads/main" ]; then
            echo "::error::Production deploys must run from refs/heads/main."
            exit 1
          fi

      - name: Resolve target SHA
        id: resolve
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${IMAGE_SHA}" ]; then
            if ! printf '%s' "${IMAGE_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::image_sha must be a full 40-character lowercase commit SHA."
              exit 1
            fi
            echo "target_sha=${IMAGE_SHA}" >> "$GITHUB_OUTPUT"
            echo "rollback=true" >> "$GITHUB_OUTPUT"
          else
            echo "target_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
            echo "rollback=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout registry validation helper
        if: ${{ inputs.target == 'docs-registry' || inputs.target == 'all' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require registry Traefik peer configuration
        if: ${{ inputs.target == 'docs-registry' || inputs.target == 'all' }}
        env:
          REGISTRY_TRAEFIK_PROXY_CIDR: ${{ vars.REGISTRY_TRAEFIK_PROXY_CIDR }}
          ROLLBACK: ${{ steps.resolve.outputs.rollback }}
        run: |
          set -euo pipefail
          # The peer is baked into the registry image at build time, so a rollback
          # ships the value its build used, not the one set now. Gating an incident
          # rollback on today's variable would prove nothing and could block it, so
          # the rollback path reports the mismatch risk instead.
          if [ "${ROLLBACK}" = "true" ]; then
            echo "::warning::This rollback re-promotes the registry image as it was built; it trusts the REGISTRY_TRAEFIK_PROXY_CIDR of that build. If the Traefik peer has changed since, deploy a fresh registry build instead."
            exit 0
          fi
          if [ -z "${REGISTRY_TRAEFIK_PROXY_CIDR}" ]; then
            echo "::error::Set the REGISTRY_TRAEFIK_PROXY_CIDR repository variable to the exact Traefik peer before deploying the registry."
            exit 1
          fi
          node scripts/monorepo/validate-registry-proxy-cidr.mjs \
            "${REGISTRY_TRAEFIK_PROXY_CIDR}"

      - name: Require CI success for target SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
        run: |
          set -euo pipefail

          run_info="$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${TARGET_SHA}&per_page=20" \
            --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .status == "completed")] | sort_by(.run_started_at // .created_at) | last | select(. != null) | [.id, .conclusion, .html_url] | @tsv')"
          if [ -z "${run_info}" ]; then
            echo "::error::No completed CI run found on main for ${TARGET_SHA}."
            exit 1
          fi

          IFS=$'\t' read -r run_id run_conclusion run_url <<< "${run_info}"
          if [ "${run_conclusion}" != "success" ]; then
            echo "::error::CI for ${TARGET_SHA} concluded '${run_conclusion}', not success: ${run_url}"
            exit 1
          fi

          jobs="$(gh api \
            "repos/${{ github.repository }}/actions/runs/${run_id}/jobs?per_page=100" \
            --jq '.jobs[] | [.name, .conclusion] | @tsv')"
          expected_jobs=(
            "Gitleaks Event-Range Scan"
            "Build, Type-Check, and Test"
          )
          for expected_job in "${expected_jobs[@]}"; do
            conclusion="$(awk -F '\t' -v job="${expected_job}" '$1 == job { print $2 }' <<< "${jobs}" | tail -n 1)"
            if [ -z "${conclusion}" ]; then
              echo "::error::CI job '${expected_job}' is missing for ${TARGET_SHA}: ${run_url}"
              exit 1
            fi
            if [ "${conclusion}" != "success" ]; then
              echo "::error::CI job '${expected_job}' concluded '${conclusion}', not success: ${run_url}"
              exit 1
            fi
          done
          echo "CI run ${run_id} is green for ${TARGET_SHA}."

  build-scan:
    name: Build and Scan ${{ matrix.service.name }}
    needs: validate-request
    # Rollback re-promotes pre-built images, so the build matrix is skipped.
    if: ${{ needs.validate-request.outputs.rollback != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: docs
            dockerfile: Dockerfile
            image: diffgazer-docs
            port: "3000"
            targets: docs-registry,all
            build_args: ""
          - name: registry
            dockerfile: deploy/registry.Dockerfile
            image: diffgazer-registry
            port: "8080"
            targets: docs-registry,all
            build_args: REGISTRY_TRAEFIK_PROXY_CIDR=${{ vars.REGISTRY_TRAEFIK_PROXY_CIDR }}
          - name: landing
            dockerfile: deploy/landing.Dockerfile
            image: diffgazer-landing
            port: "8080"
            targets: landing,all
            build_args: ""
    env:
      IMAGE_REPOSITORY: ghcr.io/b4r7x/${{ matrix.service.image }}
    steps:
      - name: Checkout
        if: ${{ contains(matrix.service.targets, inputs.target) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        if: ${{ contains(matrix.service.targets, inputs.target) }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Stamp public source identity
        if: >-
          ${{ contains(matrix.service.targets, inputs.target)
            && matrix.service.name != 'registry' }}
        env:
          SERVICE_NAME: ${{ matrix.service.name }}
          SOURCE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "${SERVICE_NAME}" in
            docs) destination="apps/docs/public/source-tag" ;;
            landing) destination="apps/landing/public/source-tag" ;;
            *) echo "::error::Unsupported identity surface: ${SERVICE_NAME}"; exit 1 ;;
          esac
          printf '%s\n' "${SOURCE_TAG}" > "${destination}"

      - name: Log in to GHCR
        if: ${{ contains(matrix.service.targets, inputs.target) }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push SHA image
        id: build
        if: ${{ contains(matrix.service.targets, inputs.target) }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          # Only the registry Dockerfile declares a build ARG; passing it to every
          # leg records inputs in the docs and landing provenance that never
          # reached those builds.
          build-args: ${{ matrix.service.build_args }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=${{ matrix.service.image }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan the manifest the build just pushed, addressed by its immutable digest.
      # Scanning the SHA tag would let anything that moves the tag between the scan
      # and the promotion put unscanned bytes into production.
      - name: Scan pushed image digest
        if: ${{ contains(matrix.service.targets, inputs.target) }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Record scanned image digest
        if: ${{ contains(matrix.service.targets, inputs.target) }}
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ matrix.service.image }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${IMAGE_DIGEST}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::The build did not report a manifest digest for ${IMAGE_NAME}."
            exit 1
          fi
          mkdir -p image-digests
          printf '%s\n' "${IMAGE_DIGEST}" > "image-digests/${IMAGE_NAME}"

      # A later rollback promotes this digest, so the record must outlive the images
      # an operator can still roll back to.
      - name: Upload scanned image digest
        if: ${{ contains(matrix.service.targets, inputs.target) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.service.name }}
          path: image-digests/${{ matrix.service.image }}
          retention-days: 90

  promote-deploy:
    name: Promote and Deploy
    needs: [validate-request, build-scan]
    # build-scan is skipped on rollback; require validate-request success and
    # build-scan to have either succeeded (fresh deploy) or been skipped (rollback).
    if: >-
      ${{ always()
        && needs.validate-request.result == 'success'
        && (needs.build-scan.result == 'success' || needs.build-scan.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Promotion happens inside an armed rollback trap, and the two public
    # verifications after it can each spend five minutes. The budget must outlast
    # both with room for the rollback itself: a cancelled runner leaves :prod on
    # unverified images with the trap only half run.
    timeout-minutes: 25
    environment: production
    permissions:
      # actions: read lets a rollback read the digest records of the run that built
      # and scanned the requested SHA.
      actions: read
      contents: read
      packages: write
    steps:
      - name: Checkout deployed SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-request.outputs.target_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download scanned image digests
        if: ${{ needs.validate-request.outputs.rollback != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-*
          path: image-digests
          merge-multiple: true

      # A rollback promotes bytes an earlier run built and scanned, so it reuses that
      # run's digest records. Re-resolving the requested SHA tag here would let anyone
      # who can move a GHCR tag route unscanned bytes into production through an
      # operator rollback.
      - name: Restore recorded image digests for rollback
        if: ${{ needs.validate-request.outputs.rollback == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ needs.validate-request.outputs.target_sha }}
          IMAGE_DIGEST_DIR: image-digests
        run: |
          set -euo pipefail
          mkdir -p "${IMAGE_DIGEST_DIR}"

          # Oldest run first: one SHA can be deployed by several runs, one per target,
          # and a later run's record for the same surface must win.
          run_ids="$(gh api \
            "repos/${GH_REPOSITORY}/actions/workflows/deploy.yml/runs?head_sha=${TARGET_SHA}&per_page=100" \
            --jq '.workflow_runs[] | [(.run_started_at // .created_at), (.id | tostring)] | @tsv' \
            | sort | cut -f2)"

          restored=0
          for run_id in ${run_ids}; do
            record_names="$(gh api \
              "repos/${GH_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false and (.name | startswith("image-digest-"))) | .name')"
            for record_name in ${record_names}; do
              gh run download "${run_id}" --repo "${GH_REPOSITORY}" \
                --name "${record_name}" --dir "${IMAGE_DIGEST_DIR}"
              restored=$((restored + 1))
            done
          done

          if [ "${restored}" -eq 0 ]; then
            echo "::error::No unexpired scanned-digest record exists for ${TARGET_SHA}; deploy a fresh build instead of rolling back."
            exit 1
          fi

      # Registry-write and Coolify credentials live on this step alone. At job scope
      # every action and every process started from the deployed checkout inherits
      # them, and none of checkout, Node setup, or the public verification scripts
      # needs them.
      - name: Promote scanned images and trigger Coolify
        env:
          IMAGE_OWNER: ghcr.io/b4r7x
          IMAGE_DIGEST_DIR: image-digests
          DEPLOY_TARGET: ${{ inputs.target }}
          SOURCE_TAG: ${{ needs.validate-request.outputs.target_sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK_DOCS: ${{ secrets.COOLIFY_WEBHOOK_DOCS }}
          COOLIFY_WEBHOOK_REGISTRY: ${{ secrets.COOLIFY_WEBHOOK_REGISTRY }}
          COOLIFY_WEBHOOK_LANDING: ${{ secrets.COOLIFY_WEBHOOK_LANDING }}
        run: |
          set -Eeuo pipefail

          require_env() {
            name="$1"
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required environment value: ${name}"
              exit 1
            fi
          }

          require_selected_secrets() {
            require_env GHCR_TOKEN
            require_env COOLIFY_TOKEN

            case "${DEPLOY_TARGET}" in
              docs-registry)
                require_env COOLIFY_WEBHOOK_DOCS
                require_env COOLIFY_WEBHOOK_REGISTRY
                ;;
              landing)
                require_env COOLIFY_WEBHOOK_LANDING
                ;;
              all)
                require_env COOLIFY_WEBHOOK_DOCS
                require_env COOLIFY_WEBHOOK_REGISTRY
                require_env COOLIFY_WEBHOOK_LANDING
                ;;
              *)
                echo "::error::Unknown deploy target: ${DEPLOY_TARGET}"
                exit 1
                ;;
            esac
          }

          # :prod always moves to the immutable digest Trivy scanned, never to a
          # mutable tag. Fresh deploys read the record this run's build uploaded and
          # rollbacks read the record restored from the run that built the SHA.
          promote() {
            image="$1"
            if ! source_digest="$(cat "${IMAGE_DIGEST_DIR}/${image}" 2> /dev/null)"; then
              echo "::error::No scanned image digest was recorded for ${image}."
              return 1
            fi
            if [[ ! "${source_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Refusing to promote ${image} from an invalid digest."
              return 1
            fi
            docker buildx imagetools create \
              --tag "${IMAGE_OWNER}/${image}:prod" \
              "${IMAGE_OWNER}/${image}@${source_digest}"
          }

          # These scripts read public endpoints from the deployed checkout. They have
          # no need for registry-write or Coolify credentials, so they do not get
          # them; the parent shell keeps them for the bounded rollback path.
          run_public_check() {
            env -u GHCR_TOKEN -u COOLIFY_TOKEN -u COOLIFY_WEBHOOK_DOCS \
              -u COOLIFY_WEBHOOK_REGISTRY -u COOLIFY_WEBHOOK_LANDING "$@"
          }

          # Docs and landing are polled for up to five minutes by
          # verify-deployed-source-tags. The registry serves no source-tag, so it gets
          # an equivalent budget here: asserting once would fail a container that is
          # still rolling over and roll back an otherwise healthy deploy.
          #
          # The budget is wall clock, not attempts. Each attempt sweeps every committed
          # registry endpoint, so an attempt cap alone bounds only the sleeping: a slow
          # origin would outlast the job timeout and cancel the runner mid-rollback.
          verify_registry() {
            budget_seconds=300
            deadline=$((SECONDS + budget_seconds))
            attempt=1
            while true; do
              if run_public_check DIFFGAZER_LIVE_REGISTRY_REQUIRED=1 \
                node scripts/monorepo/check-live-registry.mjs; then
                return 0
              fi
              if [ "${SECONDS}" -ge "${deadline}" ] || [ "${attempt}" -ge 20 ]; then
                echo "::error::Hosted registry did not serve the deployed bytes within ${budget_seconds}s (${attempt} attempts)."
                return 1
              fi
              echo "::notice::Hosted registry is not serving the deployed bytes yet (attempt ${attempt}); retrying in 15s."
              attempt=$((attempt + 1))
              sleep 15
            done
          }

          trigger() {
            name="$1"
            webhook="$2"
            if [ "$#" -ge 3 ]; then
              source_ref="$3"
            else
              source_ref="${SOURCE_TAG}"
            fi
            payload="{\"image_tag\":\"prod\",\"surface\":\"${name}\"}"
            if [ -n "${source_ref}" ]; then
              payload="{\"image_tag\":\"prod\",\"source_sha\":\"${source_ref}\",\"surface\":\"${name}\"}"
            fi
            curl -fsS -X POST "$webhook" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "${payload}"
          }

          require_selected_secrets
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

          case "${DEPLOY_TARGET}" in
            docs-registry)
              selected_services=(docs registry)
              selected_images=(diffgazer-docs diffgazer-registry)
              selected_webhooks=("${COOLIFY_WEBHOOK_DOCS}" "${COOLIFY_WEBHOOK_REGISTRY}")
              ;;
            landing)
              selected_services=(landing)
              selected_images=(diffgazer-landing)
              selected_webhooks=("${COOLIFY_WEBHOOK_LANDING}")
              ;;
            all)
              selected_services=(docs registry landing)
              selected_images=(diffgazer-docs diffgazer-registry diffgazer-landing)
              selected_webhooks=(
                "${COOLIFY_WEBHOOK_DOCS}"
                "${COOLIFY_WEBHOOK_REGISTRY}"
                "${COOLIFY_WEBHOOK_LANDING}"
              )
              ;;
            *)
              echo "::error::Unknown deploy target: ${DEPLOY_TARGET}"
              exit 1
              ;;
          esac

          declare -A previous_digests=()
          declare -A images_by_service=()
          declare -A webhooks_by_service=()
          declare -a changed_services=()

          for index in "${!selected_services[@]}"; do
            service="${selected_services[index]}"
            image="${selected_images[index]}"
            images_by_service["${service}"]="${image}"
            webhooks_by_service["${service}"]="${selected_webhooks[index]}"
            # A surface with no :prod manifest is deploying for the first time. There
            # is nothing to restore, so record an empty digest and skip it during
            # rollback rather than aborting the whole promotion under `set -e`.
            if ! digest="$(docker buildx imagetools inspect \
              --format '{{.Manifest.Digest}}' \
              "${IMAGE_OWNER}/${image}:prod" 2> /dev/null)"; then
              echo "::notice::${IMAGE_OWNER}/${image}:prod does not exist yet; ${service} is a first deploy."
              previous_digests["${service}"]=""
              continue
            fi
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Could not capture current production digest for ${service}."
              exit 1
            fi
            previous_digests["${service}"]="${digest}"
          done

          rollback_deployment() {
            original_status=$?
            trap - EXIT
            trap '' HUP INT TERM
            set +e

            for ((index=${#changed_services[@]} - 1; index >= 0; index--)); do
              service="${changed_services[index]}"
              image="${images_by_service[${service}]}"
              digest="${previous_digests[${service}]}"
              webhook="${webhooks_by_service[${service}]}"

              if [ -z "${digest}" ]; then
                echo "::error::${service} had no production image before this run; :prod now points at the failed first deploy."
                continue
              fi
              if ! docker buildx imagetools create \
                --tag "${IMAGE_OWNER}/${image}:prod" \
                "${IMAGE_OWNER}/${image}@${digest}"; then
                echo "::error::Failed to restore ${service} to ${digest}."
                continue
              fi
              if ! trigger "${service}" "${webhook}" ""; then
                echo "::error::Restored ${service} to ${digest}, but its rollback trigger failed."
              fi
            done

            exit "${original_status}"
          }
          trap rollback_deployment EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          for index in "${!selected_services[@]}"; do
            service="${selected_services[index]}"
            changed_services+=("${service}")
            promote "${selected_images[index]}"
          done

          for index in "${!selected_services[@]}"; do
            trigger "${selected_services[index]}" "${selected_webhooks[index]}"
          done

          run_public_check node scripts/monorepo/verify-deployed-source-tags.mjs

          case "${DEPLOY_TARGET}" in
            docs-registry)
              verify_registry
              ;;
            landing)
              ;;
            all)
              verify_registry
              ;;
            *)
              echo "::error::Unknown deploy target: ${DEPLOY_TARGET}"
              exit 1
              ;;
          esac

          trap - EXIT HUP INT TERM
