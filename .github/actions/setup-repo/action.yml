name: Setup repo
description: Install pnpm (version from root packageManager), Node 24 with pnpm cache, and frozen-lockfile dependencies.

inputs:
  registry-url:
    description: Optional npm registry URL to write into .npmrc (release job only, enables NODE_AUTH_TOKEN auth).
    required: false
  scope:
    description: Optional npm scope to pair with registry-url.
    required: false

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}

    - name: Install
      run: pnpm install --frozen-lockfile
      shell: bash
